# golangci-lint v2 config used by CI (the root .golangci.yml is gitignored for local configs).
version: "2"

linters:
  settings:
    staticcheck:
      checks:
        - all
        # go-jet queries are written with dot imports of the generated tables
        # and the SQL builder, which is the library's documented idiom.
        - -ST1001
        # Defaults disabled by golangci-lint v2.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    presets:
      # Keeps the v1 default of not flagging unchecked Close() errors in defers, etc.
      - std-error-handling
